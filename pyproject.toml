[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emprego-maranhao"
version = "0.3.0"
description = "Dashboard de admissões e demissões dos municípios do Maranhão - coleta de dados (etapa 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32,<3",
    "pandas>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "ijson>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "responses>=0.25,<1"]

[tool.setuptools.packages.find]
include = ["coleta*", "banco*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integracao: acessa as APIs reais do IpeaData e do IBGE (habilite com IPEA_TESTES_INTEGRACAO=1)",
    "postgresql: usa o banco PostgreSQL de testes (POSTGRES_TEST_DB); pulado se indisponível",
]
